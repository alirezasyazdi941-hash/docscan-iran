name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check for accidentally committed secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -not -path './.git/*' -not -name '.env.example' | grep -q .; then
            echo "::error::Potential secret or private key file found in repository."
            exit 1
          fi
      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Run tests when configured
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          node -e "const p=require('./package.json'); process.exit(p.scripts?.test ? 0 : 1)" && npm test -- --runInBand || {
            code=$?
            if [ "$code" -eq 1 ] && ! node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              echo "No test script configured; skipping."
            else
              exit "$code"
            fi
          }
      - name: Build when configured
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)" && npm run build || {
            code=$?
            if [ "$code" -eq 1 ] && ! node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              echo "No build script configured; skipping."
            else
              exit "$code"
            fi
          }
