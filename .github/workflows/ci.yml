name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidentally committed secret files
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) -not -path './.git/*' -not -name '.env.example' | grep -q .; then
            echo "::error::Potential secret or private key file found in repository."
            exit 1
          fi
      - name: Set up Node.js when a Node project exists
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install npm dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Run tests when configured
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script configured; skipping."
          fi
      - name: Build when configured
        if: hashFiles('package.json') != ''
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script configured; skipping."
          fi
